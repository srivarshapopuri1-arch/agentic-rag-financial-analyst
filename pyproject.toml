[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag-financial-analyst"
version = "0.1.0"
description = "Agentic RAG assistant for grounded analysis of public financial documents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "chromadb>=0.5,<2",
  "langchain>=0.3,<2",
  "langchain-chroma>=0.2,<2",
  "langchain-ollama>=1.0,<2",
  "langchain-text-splitters>=0.3,<2",
  "langgraph>=0.2,<2",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pymupdf>=1.24,<2",
  "python-dotenv>=1.0,<2",
  "streamlit>=1.37,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
